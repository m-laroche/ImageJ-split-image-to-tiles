name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the jar to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Collect plugin jar (not the -sources / -tests jars)
        run: |
          mkdir dist
          cp $(ls target/*.jar | grep -v -e '-sources' -e '-tests') dist/

      - name: Upload jar (every build)
        uses: actions/upload-artifact@v4
        with:
          name: split-image-to-tiles-jar
          path: dist/*.jar

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
